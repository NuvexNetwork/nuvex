[package]
name = "nuvex-program-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agave-feature-set = "4.3"
anchor-lang = { workspace = true }
litesvm = "0.17"
nuvex-callback-consumer = { path = "../callback-consumer", features = ["no-entrypoint"] }
nuvex-common = { workspace = true }
nuvex-job-types = { workspace = true }
nuvex-oracle-core = { path = "../../programs/oracle-core", features = ["no-entrypoint"] }
nuvex-oracle-registry = { path = "../../programs/oracle-registry", features = ["no-entrypoint"] }
nuvex-protocol-types = { workspace = true }
nuvex-verification = { path = "../../programs/verification", features = ["no-entrypoint"] }
nuvex-vrf = { workspace = true, features = ["prove"] }
solana-account = "5"
solana-address = "2.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4"
solana-signer = "3"
solana-system-interface = "3"
solana-transaction = "4"

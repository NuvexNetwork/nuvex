[package]
name = "nuvex-oracle-core"
version = "0.1.0"
description = "Nuvex oracle core program. Opens requests and fulfills VRF jobs."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "nuvex_oracle_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
nuvex-common = { workspace = true }
nuvex-job-types = { workspace = true }
nuvex-oracle-registry = { path = "../oracle-registry", features = ["no-entrypoint"] }
nuvex-protocol-types = { workspace = true }
nuvex-verification = { path = "../verification", features = ["cpi"] }
nuvex-vrf = { workspace = true }

[lints]
workspace = true

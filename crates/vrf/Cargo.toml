[package]
name = "nuvex-vrf"
version = "0.1.0"
description = "VRF alpha binding and host proving for solana-ecvrf 0.0.1."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
prove = ["dep:solana-ecvrf"]

[dependencies]
nuvex-common = { workspace = true }
nuvex-crypto = { workspace = true }
solana-ecvrf = { workspace = true, optional = true, features = ["prove"] }

[lints]
workspace = true
